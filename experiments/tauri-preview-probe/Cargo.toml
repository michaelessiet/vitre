[package]
name = "tauri-preview-probe"
version = "0.1.0"
edition = "2021"
description = "Standalone viability probe: can T3 Code's preview subsystem run on Tauri 2 / WKWebView without Chromium or CDP?"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables multiwebview (Window::add_child), the shape T3's preview
# host needs: several independent webviews inside one window.
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"

[profile.release]
opt-level = "s"
lto = true
strip = true
