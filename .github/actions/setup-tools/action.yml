name: Setup Vitre tools
description: Install the repository's Node, Vite+, pnpm, and frozen workspace dependencies
runs:
  using: composite
  steps:
    - name: Setup Vite+ and Node
      uses: voidzero-dev/setup-vp@v1
      with:
        version-file: package.json
        node-version-file: package.json
        cache: true
        run-install: false
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        run_install: false
    - name: Install dependencies
      shell: bash
      run: vp install --frozen-lockfile
