name: Build Vitre development artifact

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit that passed validation
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Apple Silicon development DMG
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: development-dmg
      - name: Verify architecture and resolve Node executable
        run: |
          test "$(uname -m)" = arm64
          test "$(node -p 'process.arch')" = arm64
          echo "VITRE_NODE=$(node -p 'process.execPath')" >> "$GITHUB_ENV"
      - name: Build and verify development DMG
        run: sh scripts/vitre/build-dmg.sh
        env:
          VITRE_SIGNING_IDENTITY: "-"
          VITRE_RELEASE_DIR: ${{ runner.temp }}/vitre-release
      - id: metadata
        name: Artifact name
        run: echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload development build
        uses: actions/upload-artifact@v7
        with:
          name: Vitre-macos-arm64-${{ steps.metadata.outputs.short_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/vitre-release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Build summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Vitre development build
          Apple Silicon DMG, SHA-256 checksum, and build metadata are attached to this run.
          This build uses an ad-hoc signature. It is not notarized and is intended for development testing.
          Artifacts expire after 14 days. This workflow does not publish a public release or update feed.
          SUMMARY
