name: Vitre CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_artifact:
        description: Build an ad-hoc Apple Silicon DMG after validation
        type: boolean
        default: true

permissions:
  contents: read

# Only PR runs share a cancelable group. Main runs must not cancel deployments.
concurrency:
  group: vitre-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.changes.outputs.native }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - id: changes
        run: node scripts/ci/changes.ts

  check:
    name: TypeScript checks and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Formatting and lint
        run: vp check
      - name: Typecheck
        run: vp run typecheck
      - name: Build bundled sidecar
        run: vp run --filter ./apps/server build:bundle
      - name: Build marketing site
        run: vp run --filter ./apps/marketing build

  test:
    name: TypeScript tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - run: vp run test

  native:
    name: Native validation
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/vitre-ci.yml

  result:
    name: CI result
    needs: [changes, check, test, native]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - run: node scripts/ci/result.ts
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          NATIVE_CHECKS: ${{ needs.changes.outputs.native }}

  artifact:
    name: Vitre development build
    needs: [changes, result]
    if: >-
      always() && needs.result.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.native == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.build_artifact))
    uses: ./.github/workflows/build-vitre.yml
    with:
      ref: ${{ github.sha }}

  relay:
    name: Cloud deployment
    needs: result
    if: >-
      !cancelled() && needs.result.result == 'success' && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' && vars.RELAY_DEPLOY_ENABLED != 'false'
    permissions:
      contents: read
      deployments: read
    uses: ./.github/workflows/deploy-relay.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      ci_result: ${{ needs.result.result }}
