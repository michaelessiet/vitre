name: Vitre PR size

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: read

jobs:
  label:
    name: Label PR size
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Labels on PRs need PR write access, including repositories with Issues disabled.
      pull-requests: write
    concurrency:
      group: vitre-pr-size-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # Run only trusted base code. Fetch PR objects as passive data, without
      # checking out the head, installing dependencies, or invoking diff drivers.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - run: node scripts/ci/labels.ts size
        env:
          GH_TOKEN: ${{ github.token }}
