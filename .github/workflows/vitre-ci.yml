name: Vitre native validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: Rust and live sidecar (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace
      - name: Single GPUI instance
        run: |
          count=$(cargo tree --locked -i gpui --prefix none | grep "^gpui v" | sort -u | wc -l | tr -d '[:space:]')
          echo "GPUI instances: $count"
          test "$count" -eq 1
      - name: Build bundled sidecar
        run: vp run --filter ./apps/server build:bundle
      - name: Contracts drift
        run: |
          node scripts/vitre/export-contracts.ts
          node scripts/vitre/export-fixtures.ts
          vp fmt crates/vitre-contracts
          cargo run --locked -p vitre-contracts-gen
          cargo fmt -p vitre-contracts
          git diff --exit-code crates/vitre-contracts
          test -z "$(git ls-files --others --exclude-standard crates/vitre-contracts)"
      - name: Live-server wire spike
        run: cargo run --locked -p vitre-rpc --example spike_rpc
      - name: Live-server typed spike
        run: cargo run --locked -p vitre-rpc --example spike_typed
      - name: Live-server client spike
        run: cargo run --locked -p vitre-client --example spike_client

  licenses:
    name: Rust licenses, bans, and sources
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
