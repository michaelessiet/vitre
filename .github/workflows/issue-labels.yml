name: Vitre repository labels

on:
  push:
    branches: [main]
    paths:
      - .github/ISSUE_TEMPLATE/**
      - .github/labels.json
      - .github/workflows/issue-labels.yml
      - scripts/ci/labels.ts
      - scripts/ci/github.ts
      - scripts/ci/changes.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitre-label-definitions
  cancel-in-progress: false

jobs:
  sync:
    name: Sync issue and size labels
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - run: node scripts/ci/labels.ts sync
        env:
          GH_TOKEN: ${{ github.token }}
