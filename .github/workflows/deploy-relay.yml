name: Deploy Vitre Cloud

on:
  workflow_call:
    inputs:
      ref:
        description: Exact validated main commit
        type: string
        required: true
      ci_result:
        description: Aggregate validation result
        type: string
        required: true

permissions:
  contents: read
  deployments: read

# Serialize both baseline selection and deployment. Retain queued main commits.
concurrency:
  group: vitre-relay-production
  cancel-in-progress: false
  queue: max

jobs:
  eligibility:
    name: Check production deployment baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.eligibility.outputs.deploy }}
      runtime: ${{ steps.eligibility.outputs.runtime }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - id: eligibility
        run: node scripts/ci/relay.ts
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_DEPLOY_ENABLED: ${{ vars.RELAY_DEPLOY_ENABLED }}
          CI_RESULT: ${{ inputs.ci_result }}
          CANDIDATE_SHA: ${{ inputs.ref }}

  deploy:
    name: Deploy validated cloud release
    needs: eligibility
    if: needs.eligibility.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      deployments: read
      id-token: write
    environment:
      name: production
    env:
      RELAY_STACK_NAME: ${{ vars.RELAY_STACK_NAME }}
      RELAY_STAGE: ${{ vars.RELAY_STAGE }}
      RELAY_PERSONAL_DEPLOYMENT: ${{ vars.RELAY_PERSONAL_DEPLOYMENT }}
      RELAY_MOBILE_ENABLED: ${{ vars.RELAY_MOBILE_ENABLED }}
      RELAY_HTTP_TRACING_ENABLED: ${{ vars.RELAY_HTTP_TRACING_ENABLED }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AXIOM_ORG_ID: ${{ vars.AXIOM_ORG_ID }}
      RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
      RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
      RELAY_TUNNEL_ZONE_NAME: ${{ vars.RELAY_TUNNEL_ZONE_NAME }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_AUDIENCE: ${{ vars.CLERK_JWT_AUDIENCE }}
      APNS_ENVIRONMENT: ${{ vars.APNS_ENVIRONMENT }}
      APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
      APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
      APNS_BUNDLE_ID: ${{ vars.APNS_BUNDLE_ID }}
      VITRE_CLOUD_ENABLED: ${{ vars.VITRE_CLOUD_ENABLED }}
      VITRE_CLOUD_ALLOWED_USER_ID: ${{ vars.VITRE_CLOUD_ALLOWED_USER_ID }}
      VITRE_CLOUD_MACHINE_URL: ${{ vars.VITRE_CLOUD_MACHINE_URL }}
      VITRE_GITHUB_APP_ID: ${{ vars.VITRE_GITHUB_APP_ID }}
      VITRE_GITHUB_INSTALLATION_IDS: ${{ vars.VITRE_GITHUB_INSTALLATION_IDS }}
      DEPLOY_CLOUD_RUNTIME: ${{ needs.eligibility.outputs.runtime == 'true' && vars.VITRE_CLOUD_MACHINE_URL != '' }}
      VITRE_CLOUD_AWS_ROLE_ARN: ${{ vars.VITRE_CLOUD_AWS_ROLE_ARN }}
      VITRE_CLOUD_AWS_REGION: ${{ vars.VITRE_CLOUD_AWS_REGION }}
      VITRE_CLOUD_INSTANCE_ID: ${{ vars.VITRE_CLOUD_INSTANCE_ID }}
      VITRE_CLOUD_RUNTIME_BUCKET: ${{ vars.VITRE_CLOUD_RUNTIME_BUCKET }}
      VITRE_CLOUD_RUNTIME_URL: ${{ vars.VITRE_CLOUD_RUNTIME_URL }}
      VITRE_CLOUD_REQUIRE_EXISTING_STACK: "true"
      ALCHEMY_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Validate production configuration
        shell: bash
        run: |
          node scripts/ci/relay.ts configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELAY_DATABASE_ADMIN_URL: ${{ secrets.RELAY_DATABASE_ADMIN_URL }}
          RELAY_DATABASE_URL: ${{ secrets.RELAY_DATABASE_URL }}
          RELAY_DATABASE_CA_CERT: ${{ secrets.RELAY_DATABASE_CA_CERT }}
          RELAY_DATABASE_CA_CERTIFICATE_ID: ${{ secrets.RELAY_DATABASE_CA_CERTIFICATE_ID }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          VITRE_CLOUD_MACHINE_TOKEN: ${{ secrets.VITRE_CLOUD_MACHINE_TOKEN }}
          VITRE_CLOUD_ENCRYPTION_KEY: ${{ secrets.VITRE_CLOUD_ENCRYPTION_KEY }}
          VITRE_GITHUB_PRIVATE_KEY: ${{ secrets.VITRE_GITHUB_PRIVATE_KEY }}
      - uses: docker/setup-buildx-action@v3
        if: env.DEPLOY_CLOUD_RUNTIME == 'true'
      - name: Build and smoke test cloud runtime
        if: env.DEPLOY_CLOUD_RUNTIME == 'true'
        env:
          REVISION: ${{ inputs.ref }}
        run: |
          CODEX_VERSION=$(node -p "require('./scripts/vitre/cloud/toolchain.json').codex")
          CLAUDE_VERSION=$(node -p "require('./scripts/vitre/cloud/toolchain.json').claude")
          node scripts/vitre/cloud/build-image.mjs "vitre-cloud:$REVISION" "$CODEX_VERSION" "$CLAUDE_VERSION"
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/microsoft/playwright/v1.60.0/utils/docker/seccomp_profile.json -o "$RUNNER_TEMP/seccomp.json"
          VITRE_SMOKE_SECCOMP_PROFILE="$RUNNER_TEMP/seccomp.json" node scripts/vitre/cloud/smoke-image.mjs "vitre-cloud:$REVISION"
          node scripts/vitre/cloud/export-machine-runtime.mjs "vitre-cloud:$REVISION" "$RUNNER_TEMP/runtime.tar"
          gzip -n "$RUNNER_TEMP/runtime.tar"
      - name: Authenticate runtime deployment
        if: env.DEPLOY_CLOUD_RUNTIME == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.VITRE_CLOUD_AWS_ROLE_ARN }}
          aws-region: ${{ vars.VITRE_CLOUD_AWS_REGION }}
          role-session-name: vitre-cloud-${{ github.run_id }}
      - name: Publish and install matching runtime
        if: env.DEPLOY_CLOUD_RUNTIME == 'true'
        env:
          REVISION: ${{ inputs.ref }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          RUNTIME_SHA=$(sha256sum "$RUNNER_TEMP/runtime.tar.gz" | cut -d ' ' -f 1)
          RUNTIME_KEY="runtime-$REVISION-$RUNTIME_SHA.tar.gz"
          node scripts/vitre/cloud/publish-runtime.mjs "$RUNNER_TEMP/runtime.tar.gz" "$VITRE_CLOUD_RUNTIME_BUCKET" "$RUNTIME_KEY"
          node scripts/ci/cloud-runtime.ts "$REVISION" "$RUNTIME_SHA" "$RUNNER_TEMP/runtime.tar.gz"
      - name: Deploy existing relay stack
        id: deploy
        shell: bash
        run: |
          if [[ -z "$RELAY_HTTP_TRACING_ENABLED" ]]; then unset RELAY_HTTP_TRACING_ENABLED; fi
          vp run --filter ./infra/relay deploy --stage "$RELAY_STAGE" --yes --github-output
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELAY_DATABASE_ADMIN_URL: ${{ secrets.RELAY_DATABASE_ADMIN_URL }}
          RELAY_DATABASE_URL: ${{ secrets.RELAY_DATABASE_URL }}
          RELAY_DATABASE_CA_CERT: ${{ secrets.RELAY_DATABASE_CA_CERT }}
          RELAY_DATABASE_CA_CERTIFICATE_ID: ${{ secrets.RELAY_DATABASE_CA_CERTIFICATE_ID }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          VITRE_CLOUD_MACHINE_TOKEN: ${{ secrets.VITRE_CLOUD_MACHINE_TOKEN }}
          VITRE_CLOUD_ENCRYPTION_KEY: ${{ secrets.VITRE_CLOUD_ENCRYPTION_KEY }}
          VITRE_GITHUB_PRIVATE_KEY: ${{ secrets.VITRE_GITHUB_PRIVATE_KEY }}
      - name: Verify deployed routes
        env:
          RELAY_URL: ${{ steps.deploy.outputs.relay_url }}
        run: |
          node scripts/ci/verify-cloud.ts "$RELAY_URL"
      - name: Deployment summary
        env:
          DEPLOY_RESULT: ${{ steps.deploy.outputs.result }}
          DEPLOY_CHANGED: ${{ steps.deploy.outputs.changed }}
        run: |
          printf 'Relay deployment: %s (infrastructure changed: %s).\n' "$DEPLOY_RESULT" "$DEPLOY_CHANGED" >> "$GITHUB_STEP_SUMMARY"
