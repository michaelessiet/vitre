name: Deploy Vitre relay

on:
  workflow_call:
    inputs:
      ref:
        description: Exact validated main commit
        type: string
        required: true
      ci_result:
        description: Aggregate validation result
        type: string
        required: true

permissions:
  contents: read
  deployments: read

# Serialize both baseline selection and deployment. Retain queued main commits.
concurrency:
  group: vitre-relay-production
  cancel-in-progress: false
  queue: max

jobs:
  eligibility:
    name: Check production deployment baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.eligibility.outputs.deploy }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - id: eligibility
        run: node scripts/ci/relay.ts
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_DEPLOY_ENABLED: ${{ vars.RELAY_DEPLOY_ENABLED }}
          CI_RESULT: ${{ inputs.ci_result }}
          CANDIDATE_SHA: ${{ inputs.ref }}

  deploy:
    name: Deploy validated relay
    needs: eligibility
    if: needs.eligibility.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
    env:
      RELAY_STACK_NAME: ${{ vars.RELAY_STACK_NAME }}
      RELAY_STAGE: ${{ vars.RELAY_STAGE }}
      RELAY_PERSONAL_DEPLOYMENT: ${{ vars.RELAY_PERSONAL_DEPLOYMENT }}
      RELAY_MOBILE_ENABLED: ${{ vars.RELAY_MOBILE_ENABLED }}
      RELAY_HTTP_TRACING_ENABLED: ${{ vars.RELAY_HTTP_TRACING_ENABLED }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AXIOM_ORG_ID: ${{ vars.AXIOM_ORG_ID }}
      RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
      RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
      RELAY_TUNNEL_ZONE_NAME: ${{ vars.RELAY_TUNNEL_ZONE_NAME }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_AUDIENCE: ${{ vars.CLERK_JWT_AUDIENCE }}
      APNS_ENVIRONMENT: ${{ vars.APNS_ENVIRONMENT }}
      APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
      APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
      APNS_BUNDLE_ID: ${{ vars.APNS_BUNDLE_ID }}
      VITRE_CLOUD_ENABLED: ${{ vars.VITRE_CLOUD_ENABLED }}
      VITRE_CLOUD_ALLOWED_USER_ID: ${{ vars.VITRE_CLOUD_ALLOWED_USER_ID }}
      VITRE_CLOUD_MACHINE_URL: ${{ vars.VITRE_CLOUD_MACHINE_URL }}
      VITRE_GITHUB_APP_ID: ${{ vars.VITRE_GITHUB_APP_ID }}
      VITRE_GITHUB_INSTALLATION_IDS: ${{ vars.VITRE_GITHUB_INSTALLATION_IDS }}
      VITRE_CLOUD_REQUIRE_EXISTING_STACK: "true"
      ALCHEMY_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup-tools
      - name: Validate configuration and deploy existing stack
        id: deploy
        shell: bash
        run: |
          # Empty optional settings must be absent so deployment defaults apply.
          if [[ -z "$RELAY_HTTP_TRACING_ENABLED" ]]; then unset RELAY_HTTP_TRACING_ENABLED; fi
          node scripts/ci/relay.ts configuration
          vp run --filter ./infra/relay deploy --stage "$RELAY_STAGE" --yes --github-output
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELAY_DATABASE_ADMIN_URL: ${{ secrets.RELAY_DATABASE_ADMIN_URL }}
          RELAY_DATABASE_URL: ${{ secrets.RELAY_DATABASE_URL }}
          RELAY_DATABASE_CA_CERT: ${{ secrets.RELAY_DATABASE_CA_CERT }}
          RELAY_DATABASE_CA_CERTIFICATE_ID: ${{ secrets.RELAY_DATABASE_CA_CERTIFICATE_ID }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          VITRE_CLOUD_MACHINE_TOKEN: ${{ secrets.VITRE_CLOUD_MACHINE_TOKEN }}
          VITRE_CLOUD_ENCRYPTION_KEY: ${{ secrets.VITRE_CLOUD_ENCRYPTION_KEY }}
          VITRE_GITHUB_PRIVATE_KEY: ${{ secrets.VITRE_GITHUB_PRIVATE_KEY }}
      - name: Deployment summary
        env:
          DEPLOY_RESULT: ${{ steps.deploy.outputs.result }}
          DEPLOY_CHANGED: ${{ steps.deploy.outputs.changed }}
        run: |
          printf 'Relay deployment: %s (infrastructure changed: %s).\n' "$DEPLOY_RESULT" "$DEPLOY_CHANGED" >> "$GITHUB_STEP_SUMMARY"
