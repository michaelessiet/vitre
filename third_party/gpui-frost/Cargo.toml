# Narrow Apache-2.0 GPUI fork; see VENDOR.md for provenance and local patches.
[workspace]
resolver = "2"
members = ["gpui", "gpui_apple", "gpui_macos", "gpui_platform"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_macos = "0.26.0"
anyhow = "1.0.86"
async-channel = "2.5.0"
async-task = "4.7"
backtrace = "0.3"
bitflags = "2.6.0"
block = "0.1"
block2 = "0.6"
cbindgen = { version = "0.28.0", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
cocoa = "=0.26.0"
collections = { version = "0.1.0", git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
console_error_panic_hook = "0.1.7"
core-foundation = "0.10"
core-foundation-sys = "0.8.6"
core-graphics = "0.24"
core-text = "21"
core-video = { version = "0.5.2", features = ["metal"] }
criterion = { version = "0.5", features = ["html_reports"] }
ctor = "1.0.12"
derive_more = { version = "2.1.1", features = [
  "add",
  "add_assign",
  "deref",
  "deref_mut",
  "display",
  "from",
  "from_str",
  "mul",
  "mul_assign",
  "not",
] }
env_logger = "0.11"
etagere = "0.2"
foreign-types = "0.5"
futures = "0.3.32"
futures-concurrency = "7.7.1"
gpui = { default-features = false, path = "gpui" }
gpui_apple = { path = "gpui_apple" }
gpui_linux = { default-features = false, git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
gpui_macos = { default-features = false, path = "gpui_macos" }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
gpui_platform = { default-features = false, path = "gpui_platform" }
gpui_shared_string = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
gpui_util = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
gpui_web = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
gpui_windows = { default-features = false, git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
hdrhistogram = { version = "7", default-features = false }
heapless = "0.9.2"
http_client = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
image = { version = "0.25.1", default-features = false, features = [
  "bmp",
  "dds",
  "exr",
  "ff",
  "gif",
  "hdr",
  "ico",
  "jpeg",
  "png",
  "pnm",
  "qoi",
  "rayon",
  "tga",
  "tiff",
  "webp",
] }
inventory = "0.3.19"
itertools = "0.14.0"
libc = "0.2"
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
mach2 = "0.5"
media = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
metal = "0.33"
objc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSButton",
  "NSControl",
  "NSGraphics",
  "NSResponder",
  "NSView",
  "NSWindow",
  "objc2-core-foundation",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
  "NSArray",
  "NSAttributedString",
  "NSBundle",
  "NSCoder",
  "NSData",
  "NSDate",
  "NSDictionary",
  "NSEnumerator",
  "NSError",
  "NSGeometry",
  "NSNotification",
  "NSNull",
  "NSObjCRuntime",
  "NSObject",
  "NSProcessInfo",
  "NSRange",
  "NSRunLoop",
  "NSSet",
  "NSString",
  "NSURL",
  "NSUndoManager",
  "NSValue",
  "objc2-core-foundation",
  "std",
] }
objc2-user-notifications = "0.3"
parking_lot = "0.12.1"
pathfinder_geometry = "0.5"
pollster = "0.4.0"
postage = { version = "0.5", features = ["futures-traits"] }
profiling = "1"
proptest = { git = "https://github.com/proptest-rs/proptest", rev = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b", features = [
  "attr-macro",
] }
rand = "0.9"
raw-window-handle = "0.6"
refineable = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
regex = "1.5"
reqwest_client = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
resvg = { version = "0.46.0", default-features = false, features = [
  "text",
  "system-fonts",
  "memmap-fonts",
  "raster-images",
] }
scap = { git = "https://github.com/zed-industries/scap", rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac", default-features = false, package = "zed-scap", version = "0.0.8-zed" }
scheduler = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
schemars = { version = "1.0", features = ["indexmap2"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0.221", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
slotmap = "1.0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
stacksafe = "1.0"
strum = { version = "0.28", features = ["derive"] }
sum_tree = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
thiserror = "2.0.12"
tracing = "0.1.40"
unicode-segmentation = "1.10"
url = "2.2"
usvg = { version = "0.46.0", default-features = false }
util_macros = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }
uuid = { version = "1.1.2", features = ["v4", "v5", "v7", "serde"] }
wasm-bindgen = "0.2.120"
web-time = "1.1.0"
windows = { version = "0.61", features = [
  "Data_Xml_Dom",
  "Foundation_Numerics",
  "Globalization_DateTimeFormatting",
  "Storage_Search",
  "Storage_Streams",
  "System_Threading",
  "UI_Notifications",
  "UI_ViewManagement",
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_DirectManipulation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_Hlsl",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_DataExchange",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Performance",
  "Win32_System_Pipes",
  "Win32_System_RestartManager",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Ime",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Pointer",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media",
] }
ztracing = { git = "https://github.com/zed-industries/zed", rev = "f66ed399cdde86092af8af3dc7b418abf45f37f8" }

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }
# These unchanged upstream bindings were previously dependency-lint capped.
# Keep their Cocoa deprecations from obscuring application diagnostics.
deprecated = "allow"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
